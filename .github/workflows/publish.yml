# The owner publishes the first release manually; npm trusted publishing is configured after that.
name: Publish
"on":
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: "0.15"
      - run: npm ci
      # Trusted publishing needs a newer npm than the runner's.
      - run: npm install --global npm@latest
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js compile templates/ntu-thesis/example.typ
      - run: scripts/check-pack.sh
      - name: Check release version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
